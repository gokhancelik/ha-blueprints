blueprint:
  name: Lights left on - Label based (Event Driven)
  description: >
    Monitors lights assigned to a label. When any light remains on continuously
    for the configured duration, it triggers immediately to notify and/or turn off.
  domain: automation

  input:
    light_label:
      name: Light label
      description: All light entities assigned to this label will be monitored.
      selector:
        label:

    duration_minutes:
      name: Time before notification
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: minutes
          mode: box

    notification_service:
      name: Notification service
      description: The full notification service name (e.g., notify.mobile_app_pixel_8).
      selector:
        text:

    turn_off_lights:
      name: Turn off lights
      description: Automatically turn off the light after sending the notification.
      default: true
      selector:
        boolean:

# 'queued' mode allows multiple lights left on at different times to be handled independently
mode: queued
max: 10

triggers:
  - trigger: state
    entity_id:
      label_id: !input light_label
    to: "on"
    for:
      minutes: !input duration_minutes

actions:
  - variables:
      minutes_input: !input duration_minutes
      turn_off_bool: !input turn_off_lights
      # The trigger object gives us the exact entity that crossed the threshold
      target_entity: "{{ trigger.entity_id }}"
      target_name: "{{ state_attr(target_entity, 'friendly_name') or target_entity }}"

  # Extra safety check to ensure it's actually a light entity
  - condition: template
    value_template: "{{ target_entity.startswith('light.') }}"

  - action: !input notification_service
    data:
      title: "💡 Light left on"
      message: >
        {{ target_name }} has been on for {{ minutes_input | int }} minutes.

  - if:
      - condition: template
        value_template: "{{ turn_off_bool }}"
    then:
      - action: light.turn_off
        target:
          entity_id: "{{ target_entity }}"
