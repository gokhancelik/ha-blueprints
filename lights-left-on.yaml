blueprint:
  name: Lights left on - Label based
  description: >
    Monitors all light entities assigned to a selected label.
    When any light remains on continuously for the configured duration,
    a notification is sent and the light can optionally be turned off.
  domain: automation

  input:
    light_label:
      name: Light label
      description: All light entities assigned to this label will be monitored.
      selector:
        label:

    duration_minutes:
      name: Time before notification
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: minutes
          mode: box

    notification_service:
      name: Notification entity / device
      description: Select the notification service or mobile app device to notify.
      selector:
        entity:
          domain: notify

    turn_off_lights:
      name: Turn off lights
      description: Automatically turn off lights after sending the notification.
      default: true
      selector:
        boolean:

mode: single

triggers:
  - trigger: time_pattern
    minutes: "/1"

actions:
  - variables:
      label_id: !input light_label
      minutes_input: !input duration_minutes
      turn_off_bool: !input turn_off_lights
      timeout_seconds: "{{ (minutes_input | int(30)) * 60 }}"

      lights_to_notify: >-
        {% set ns = namespace(lights=[]) %}
        {% for entity_id in label_entities(label_id) %}
          {% if entity_id.startswith('light.') and states(entity_id) == 'on' %}
            {% set elapsed = as_timestamp(now()) - as_timestamp(states[entity_id].last_changed) %}
            {% if elapsed >= timeout_seconds | int %}
              {% set ns.lights = ns.lights + [entity_id] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.lights }}

      light_names: >-
        {{ expand(lights_to_notify)
           | map(attribute='name')
           | list
           | join(', ') }}

  - condition: template
    value_template: "{{ lights_to_notify | count > 0 }}"

  - action: !input notification_service
    data:
      title: "💡 Lights left on"
      message: >-
        {{ light_names }}
        {{ 'has' if lights_to_notify | count == 1 else 'have' }}
        been on for {{ minutes_input | int }} minutes.

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ turn_off_bool }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ lights_to_notify }}"
